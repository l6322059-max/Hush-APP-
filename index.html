<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0D16">
<title>Hush</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D16;--sf:#221E2E;--ink:#F4F1FA;--mute:#8E88A3;--line:#2A2538;--accent:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "DM Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lib{height:100%;overflow-y:auto;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 0 calc(env(safe-area-inset-bottom,0px) + 190px)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 18px 14px}
h1{font:800 30px/1 "Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.ib{width:40px;height:40px;border-radius:50%;background:var(--sf);display:grid;place-items:center}
.ib svg{width:19px;height:19px}
.ib.ac{background:var(--accent);color:var(--bg)}
.chips{display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto}
.tab{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--sf);color:#CFC9E0;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
#sbox{display:none;padding:0 18px 12px}
#sbox.open{display:block}
.search{width:100%;border:0;background:var(--sf);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit;font-size:14px}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center}
.row.on .mt b{color:var(--accent)}
.pl{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:8px 4px 8px 18px;text-align:left}
.art{width:52px;height:52px;border-radius:12px;flex:none}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.mt b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.lk{width:44px;height:44px;margin-right:8px;display:grid;place-items:center;color:var(--mute)}
.lk svg{width:20px;height:20px}
.lk.y,.lk.ok{color:var(--accent)}
.lk.y svg{fill:currentColor}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;margin-right:4px}
.eq i{width:3px;height:9px;background:var(--accent);border-radius:2px;transform-origin:bottom}
.eq i:nth-child(2){height:14px}.eq i:nth-child(3){height:6px}
.playing .row.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.playing .row.on .eq i:nth-child(2){animation-delay:.2s}.playing .row.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.playing .row.on .eq i{animation:none}}
.empty{text-align:center;padding:48px 24px;color:var(--mute)}
.empty h2{font:700 22px "Bricolage Grotesque","DM Sans",sans-serif;color:var(--ink);margin:0 0 8px}
.add{background:var(--accent);color:var(--bg);font-weight:700;padding:11px 18px;border-radius:999px;margin-top:18px}
#mini{display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-width:536px;margin:0 auto;background:var(--sf);border-radius:18px;padding:10px 12px;align-items:center;gap:12px;overflow:hidden;cursor:pointer;z-index:4}
.has #mini{display:flex}
#mini .art{width:44px;height:44px;border-radius:10px}
#mpp{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
#mpp svg{width:18px;height:18px}
#mBar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid rgba(255,255,255,.07);background:var(--bg);z-index:3}
.n{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);min-width:72px;padding:4px 0}
.n svg{width:22px;height:22px}
.n[aria-pressed="true"]{color:var(--accent)}
#np{position:fixed;inset:0;background:var(--bg);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 16px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
#np.open{transform:none;visibility:visible;transition:transform .28s ease}
.npi{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.nh{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;color:var(--mute);font-size:13px}
.nh .ib{background:none}
#pArt{width:min(100%,46vh);aspect-ratio:1;border-radius:24px;margin:0 auto;background:var(--line)}
.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
#pTitle{font:700 23px/1.2 "Bricolage Grotesque","DM Sans",sans-serif}
#pSub{color:var(--mute);font-size:15px;margin-top:2px}
#pLike{margin:0}
.seek{margin:18px 0 6px}
.seek input{width:100%;accent-color:var(--accent);margin:0;height:28px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.ic{width:46px;height:46px;display:grid;place-items:center;color:var(--mute);position:relative;border-radius:50%}
.ic svg{width:24px;height:24px}
.ic.on{color:var(--accent)}
.ic.skip{color:var(--ink)}
.ic.skip svg{width:30px;height:30px}
.ic.rep[data-m="2"]::after{content:"1";position:absolute;font-size:9px;font-weight:700;top:19px;left:0;right:0;text-align:center}
.big{width:68px;height:68px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.big svg{width:28px;height:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="lib">
  <div class="hd"><h1 id="ttl">Library</h1>
    <div style="display:flex;gap:8px"><button class="ib" id="sbtn" aria-label="Search" data-ic="search"></button><button class="ib ac" id="add" aria-label="Add music" data-ic="plus"></button></div></div>
  <div class="chips">
    <button class="tab" data-tab="all" aria-pressed="true">All songs</button>
    <button class="tab" data-tab="liked" aria-pressed="false">Liked</button>
    <button class="tab" data-tab="find" aria-pressed="false">Find online</button>
  </div>
  <div id="sbox"><input class="search" id="q" type="search" enterkeyhint="search" placeholder="Search your songs" aria-label="Search"></div>
  <ul id="list"></ul>
  <div class="empty" id="empty"></div>
</main>
<div id="mini"><span class="art" id="mArt"></span><span class="mt"><b id="mTitle"></b><small id="mSub"></small></span><button id="mpp" aria-label="Play" data-ic="play"></button><div id="mBar"></div></div>
<nav>
  <button class="n" data-tab="all" aria-pressed="true"><span data-ic="lib"></span>Library</button>
  <button class="n" data-tab="find" aria-pressed="false"><span data-ic="search"></span>Find</button>
  <button class="n" data-tab="liked" aria-pressed="false"><span data-ic="heart"></span>Liked</button>
</nav>
<section id="np" aria-label="Now playing"><div class="npi">
  <div class="nh"><button class="ib" id="close" aria-label="Close player" data-ic="down"></button><span>Now playing</span><span style="width:40px"></span></div>
  <div id="pArt"></div>
  <div class="tr"><div style="min-width:0"><div id="pTitle">Nothing playing</div><div id="pSub"></div></div><button class="lk" id="pLike" aria-label="Like" data-ic="heart"></button></div>
  <div class="seek"><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek"><div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
  <div class="ctl">
    <button class="ic" id="shuf" aria-label="Shuffle" aria-pressed="false"></button>
    <button class="ic skip" id="prev" aria-label="Previous song"></button>
    <button class="big" id="pp" aria-label="Play"></button>
    <button class="ic skip" id="next" aria-label="Next song"></button>
    <button class="ic rep" id="rep" aria-label="Repeat off" data-m="0"></button>
  </div>
</div></section>
<input type="file" id="file" accept="audio/*" multiple class="sr" tabindex="-1">
<script src="app.js"></script>
</body>
</html>
